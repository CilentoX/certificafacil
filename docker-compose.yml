services:
  db:
    image: mysql:8.0
    container_name: cf-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: certificafacil
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: cf-api
    restart: always
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-rootpassword}@db:3306/certificafacil
      JWT_SECRET: ${JWT_SECRET}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      BREVO_API_KEY: ${BREVO_API_KEY}
      APP_URL: ${APP_URL}
      API_BASE_URL: ${API_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  web:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: cf-web
    restart: always
    depends_on:
      - api

volumes:
  mysql-data:

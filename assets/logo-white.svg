<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <!-- Icon -->
  <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#iconBg)"/>
  <!-- Certificate paper -->
  <rect x="9" y="6" width="22" height="28" rx="2" fill="url(#paper)" opacity="0.95"/>
  <!-- Header line -->
  <rect x="14" y="11" width="12" height="1.5" rx="0.75" fill="#6366f1" opacity="0.6"/>
  <!-- Body lines -->
  <rect x="12" y="16" width="16" height="1" rx="0.5" fill="#818cf8" opacity="0.35"/>
  <rect x="14" y="19" width="12" height="1" rx="0.5" fill="#818cf8" opacity="0.25"/>
  <!-- Name highlight -->
  <rect x="13" y="22" width="14" height="3.5" rx="1.5" fill="#4f46e5" opacity="0.15"/>
  <rect x="15" y="23" width="10" height="1.5" rx="0.75" fill="#4f46e5" opacity="0.5"/>
  <!-- Seal -->
  <circle cx="20" cy="29.5" r="3" fill="#4f46e5" opacity="0.8"/>
  <circle cx="20" cy="29.5" r="2" fill="none" stroke="#e0e7ff" stroke-width="0.5"/>
  <path d="M18.8 29.5 L19.7 30.4 L21.2 28.8" fill="none" stroke="#e0e7ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text: Certifica -->
  <text x="48" y="27" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="400" fill="#e5e5e5" letter-spacing="-0.3">Certifica<tspan font-weight="800" fill="#818cf8">Facil</tspan></text>
</svg>

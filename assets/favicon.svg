<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Certificate paper -->
  <rect x="14" y="10" width="36" height="44" rx="3" fill="url(#cert)" opacity="0.95"/>
  <rect x="14" y="10" width="36" height="44" rx="3" fill="none" stroke="#a5b4fc" stroke-width="0.5" opacity="0.5"/>
  <!-- Certificate fold/ribbon -->
  <path d="M14 51 L14 54 Q14 54 17 54 L50 54 Q50 54 50 51" fill="#a5b4fc" opacity="0.3"/>
  <!-- Header line -->
  <rect x="22" y="17" width="20" height="2" rx="1" fill="#6366f1" opacity="0.6"/>
  <!-- Body lines -->
  <rect x="19" y="24" width="26" height="1.5" rx="0.75" fill="#818cf8" opacity="0.35"/>
  <rect x="22" y="29" width="20" height="1.5" rx="0.75" fill="#818cf8" opacity="0.25"/>
  <!-- Name placeholder highlight -->
  <rect x="20" y="34" width="24" height="5" rx="2" fill="#4f46e5" opacity="0.15"/>
  <rect x="24" y="35.5" width="16" height="2" rx="1" fill="#4f46e5" opacity="0.5"/>
  <!-- Seal/badge -->
  <circle cx="32" cy="45" r="4.5" fill="#4f46e5" opacity="0.8"/>
  <circle cx="32" cy="45" r="3" fill="none" stroke="#e0e7ff" stroke-width="0.7"/>
  <path d="M30 45 L31.5 46.5 L34 43.5" fill="none" stroke="#e0e7ff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner fold -->
  <path d="M50 10 L44 10 Q50 10 50 16 Z" fill="#c7d2fe" opacity="0.5"/>
  <path d="M44 10 L50 16" fill="none" stroke="#a5b4fc" stroke-width="0.5" opacity="0.3"/>
</svg>

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    charset utf-8;

    # ── API Routes → PHP-FPM ──────────────────────────────
    location ~ ^/api/ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index api.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/api.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120s;
    }

    # ── Page Routes (SPA-style) ──────────────────────────
    location = /login {
        try_files /frontend/login.html =404;
    }
    location = /register {
        try_files /frontend/register.html =404;
    }
    location = /admin {
        try_files /frontend/admin.html =404;
    }
    location = /app {
        try_files /frontend/app.html =404;
    }
    location = /settings {
        try_files /frontend/settings.html =404;
    }

    # ── Static assets ────────────────────────────────────
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Frontend static files (js, css) ──────────────────
    location /js/ {
        alias /var/www/html/frontend/js/;
        expires 1h;
    }
    location = /style.css {
        alias /var/www/html/frontend/style.css;
        expires 1h;
    }

    # ── Uploads (generated certificates) ─────────────────
    location /uploads/ {
        internal;
    }

    # ── Root → landing page ──────────────────────────────
    location = / {
        try_files /frontend/index.html =404;
    }

    # Block hidden files and sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~ ^/(config|database|docker|backend|\.env|_temp|composer|vendor) {
        deny all;
        return 404;
    }

    # Fallback
    location / {
        try_files $uri /frontend/$uri /frontend/index.html;
    }
}

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Criar conta — CertificaFacil</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: #fafafa;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 40px 36px;
        width: 100%;
        max-width: 400px;
      }
      .logo {
        font-size: 20px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
        letter-spacing: -0.3px;
      }
      .logo span {
        color: #4338ca;
      }
      .subtitle {
        text-align: center;
        font-size: 14px;
        color: #888;
        margin-bottom: 32px;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #555;
      }
      .field input {
        width: 100%;
        padding: 10px 14px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fafafa;
        outline: none;
        transition: border-color 0.15s;
        font-family: inherit;
        color: #1a1a1a;
      }
      .field input:focus {
        border-color: #4338ca;
        background: #fff;
      }
      .error-msg {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 18px;
        display: none;
      }
      .btn-submit {
        width: 100%;
        padding: 11px;
        background: #4338ca;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
      }
      .btn-submit:hover {
        background: #6366f1;
      }
      .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .bottom {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #888;
      }
      .bottom a {
        color: #4338ca;
        font-weight: 500;
        text-decoration: none;
      }
      .bottom a:hover {
        text-decoration: underline;
      }
      .home-link {
        display: block;
        text-align: center;
        margin-top: 16px;
        font-size: 13px;
        color: #aaa;
        text-decoration: none;
      }
      .home-link:hover {
        color: #555;
      }
      .trial-note {
        text-align: center;
        font-size: 12px;
        color: #aaa;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img src="/assets/logo.svg" alt="CertificaFacil" style="height: 36px; width: auto" />
      </div>
      <p class="subtitle">Crie sua conta gratuita</p>
      <div class="error-msg" id="error"></div>
      <form id="registerForm">
        <div class="field">
          <label for="name">Nome</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            autocomplete="name"
            placeholder="Seu nome"
          />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="seu@email.com"
          />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
            minlength="6"
          />
        </div>
        <button type="submit" class="btn-submit" id="btnSubmit">Criar conta</button>
      </form>
      <p class="trial-note">7 dias de trial grátis. Sem cartão de crédito.</p>
      <p class="bottom">Já tem conta? <a href="/login">Entrar</a></p>
      <a href="/" class="home-link">← Voltar ao início</a>
    </div>

    <script>
      const form = document.getElementById('registerForm');
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('btnSubmit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Criando conta...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: form.name.value.trim(),
              email: form.email.value.trim(),
              password: form.password.value,
            }),
          });
          const data = await res.json();
          if (!data.ok) {
            errorEl.textContent = data.error || 'Erro ao criar conta.';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Criar conta';
            return;
          }
          localStorage.setItem('cf_token', data.token);
          localStorage.setItem('cf_user', JSON.stringify(data.user));
          window.location.href = '/app';
        } catch (err) {
          errorEl.textContent = 'Erro de conexão com o servidor.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Criar conta';
        }
      });
    </script>
  </body>
</html>

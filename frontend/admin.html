<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Painel — CertificaFacil</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f5f5;
        --surface: #fff;
        --text: #1a1a1a;
        --text-2: #555;
        --text-3: #999;
        --border: #e5e5e5;
        --accent: #4338ca;
        --accent-light: #6366f1;
        --accent-bg: #eef2ff;
        --danger: #dc2626;
        --danger-bg: #fef2f2;
        --success: #16a34a;
        --success-bg: #f0fdf4;
        --warn: #d97706;
        --warn-bg: #fffbeb;
        --radius: 8px;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* ── LAYOUT ─────────────────────────────────── */
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }

      /* ── SIDEBAR ────────────────────────────────── */
      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 20px 0;
        display: flex;
        flex-direction: column;
      }
      .sidebar-logo {
        font-size: 17px;
        font-weight: 700;
        padding: 0 20px;
        margin-bottom: 28px;
        letter-spacing: -0.3px;
      }
      .sidebar-logo span {
        color: var(--accent);
      }
      .sidebar-nav {
        flex: 1;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 20px;
        font-size: 14px;
        color: var(--text-2);
        cursor: pointer;
        transition: all 0.12s;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        font-family: inherit;
      }
      .nav-item:hover {
        background: #f8f8f8;
        color: var(--text);
      }
      .nav-item.active {
        color: var(--accent);
        background: var(--accent-bg);
        font-weight: 500;
      }
      .nav-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .sidebar-bottom {
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        margin-top: auto;
      }
      .user-info {
        font-size: 13px;
        color: var(--text-2);
        margin-bottom: 8px;
      }
      .user-info strong {
        display: block;
        color: var(--text);
        font-weight: 600;
      }
      .btn-logout {
        font-size: 13px;
        color: var(--danger);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        font-family: inherit;
      }
      .btn-logout:hover {
        text-decoration: underline;
      }

      /* ── MAIN ───────────────────────────────────── */
      .main {
        padding: 28px 32px;
        overflow-y: auto;
        max-height: 100vh;
      }
      .page-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin-bottom: 24px;
      }

      /* ── STATS CARDS ─────────────────────────────── */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 28px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
      }
      .stat-card .label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .stat-card .value {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      /* ── TABLE ──────────────────────────────────── */
      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .table-header {
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      .table-header h3 {
        font-size: 15px;
        font-weight: 600;
      }
      .search-input {
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        outline: none;
        width: 220px;
        font-family: inherit;
        color: var(--text);
      }
      .search-input:focus {
        border-color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border);
        background: #fafafa;
      }
      td {
        padding: 12px 20px;
        font-size: 13px;
        border-bottom: 1px solid #f0f0f0;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: #fafafa;
      }

      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .badge-admin {
        background: var(--accent-bg);
        color: var(--accent);
      }
      .badge-user {
        background: #f3f4f6;
        color: #6b7280;
      }
      .badge-active {
        background: var(--success-bg);
        color: var(--success);
      }
      .badge-inactive {
        background: var(--danger-bg);
        color: var(--danger);
      }

      .action-btn {
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        font-size: 12px;
        cursor: pointer;
        color: var(--text-2);
        font-family: inherit;
        transition: all 0.12s;
      }
      .action-btn:hover {
        background: #f0f0f0;
      }
      .action-btn.danger {
        color: var(--danger);
        border-color: #fca5a5;
      }
      .action-btn.danger:hover {
        background: var(--danger-bg);
      }

      .actions-cell {
        display: flex;
        gap: 6px;
      }

      /* ── ACTIVITY ───────────────────────────────── */
      .activity-list {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .activity-list h3 {
        padding: 16px 20px;
        font-size: 15px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      .activity-item {
        padding: 10px 20px;
        font-size: 13px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .activity-item:last-child {
        border-bottom: none;
      }
      .activity-item .meta {
        font-size: 12px;
        color: var(--text-3);
      }

      /* ── SETTINGS FORM ──────────────────────────── */
      .settings-form {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        max-width: 500px;
      }
      .settings-form h3 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 20px;
      }
      .form-row {
        margin-bottom: 16px;
      }
      .form-row label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-2);
        margin-bottom: 5px;
      }
      .form-row input,
      .form-row select {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        outline: none;
      }
      .form-row input:focus,
      .form-row select:focus {
        border-color: var(--accent);
      }
      .btn-save {
        padding: 9px 24px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-save:hover {
        background: var(--accent-light);
      }
      .save-ok {
        display: inline-block;
        margin-left: 12px;
        font-size: 13px;
        color: var(--success);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .save-ok.show {
        opacity: 1;
      }

      /* ── SECTION VISIBILITY ─────────────────────── */
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }

      /* ── RESPONSIVE ─────────────────────────────── */
      @media (max-width: 768px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: fixed;
          left: -260px;
          top: 0;
          bottom: 0;
          width: 260px;
          z-index: 100;
          transition: left 0.2s;
        }
        .sidebar.open {
          left: 0;
        }
        .main {
          padding: 20px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <img
            src="/assets/logo-white.svg"
            alt="CertificaFacil"
            style="height: 28px; width: auto"
          />
        </div>
        <nav class="sidebar-nav">
          <button
            class="nav-item active"
            data-section="dashboard"
            onclick="showSection('dashboard')"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            Dashboard
          </button>
          <button class="nav-item" data-section="users" onclick="showSection('users')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Usuários
          </button>
          <button class="nav-item" data-section="activity" onclick="showSection('activity')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
            Atividade
          </button>
          <button class="nav-item" data-section="settings" onclick="showSection('settings')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
              />
            </svg>
            Configurações
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="user-info">
            <strong id="adminName">Admin</strong>
            <span id="adminEmail">admin@certificafacil.com</span>
          </div>
          <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
        <a
          href="/app"
          class="nav-item"
          style="margin-top: 4px; border-top: 1px solid var(--border); padding-top: 12px"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
          Ir ao Editor
        </a>
      </aside>

      <!-- Main -->
      <main class="main">
        <!-- DASHBOARD -->
        <div class="section active" id="sec-dashboard">
          <h1 class="page-title">Dashboard</h1>
          <div class="stats">
            <div class="stat-card">
              <div class="label">Usuários</div>
              <div class="value" id="st-users">—</div>
            </div>
            <div class="stat-card">
              <div class="label">Ativos</div>
              <div class="value" id="st-active">—</div>
            </div>
            <div class="stat-card">
              <div class="label">Certificados</div>
              <div class="value" id="st-certs">—</div>
            </div>
            <div class="stat-card">
              <div class="label">Logins hoje</div>
              <div class="value" id="st-logins">—</div>
            </div>
          </div>

          <div class="activity-list" id="dash-activity">
            <h3>Atividade recente</h3>
            <div id="dash-activity-items"></div>
          </div>
        </div>

        <!-- USERS -->
        <div class="section" id="sec-users">
          <h1 class="page-title">Usuários</h1>
          <div class="table-wrap">
            <div class="table-header">
              <h3>Todos os usuários</h3>
              <input
                type="text"
                class="search-input"
                id="userSearch"
                placeholder="Buscar por nome ou e-mail..."
                oninput="searchUsers()"
              />
            </div>
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Papel</th>
                  <th>Plano</th>
                  <th>Status</th>
                  <th>Cadastro</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>
          <div
            style="margin-top: 12px; display: flex; gap: 8px; justify-content: center"
            id="usersPagination"
          ></div>
        </div>

        <!-- ACTIVITY -->
        <div class="section" id="sec-activity">
          <h1 class="page-title">Log de atividade</h1>
          <div class="activity-list">
            <h3>Últimas ações</h3>
            <div id="activityItems"></div>
          </div>
        </div>

        <!-- SETTINGS -->
        <div class="section" id="sec-settings">
          <h1 class="page-title">Configurações</h1>
          <div class="settings-form">
            <h3>Configurações do sistema</h3>
            <div class="form-row">
              <label for="set-site-name">Nome do site</label>
              <input type="text" id="set-site-name" data-key="site_name" />
            </div>
            <div class="form-row">
              <label for="set-registration">Permitir registro</label>
              <select id="set-registration" data-key="allow_registration">
                <option value="1">Sim</option>
                <option value="0">Não</option>
              </select>
            </div>
            <div class="form-row">
              <label for="set-trial-days">Dias de trial</label>
              <input type="number" id="set-trial-days" data-key="trial_days" min="1" max="90" />
            </div>
            <div class="form-row">
              <label for="set-maintenance">Modo manutenção</label>
              <select id="set-maintenance" data-key="maintenance_mode">
                <option value="0">Desligado</option>
                <option value="1">Ligado</option>
              </select>
            </div>
            <button class="btn-save" onclick="saveSettings()">Salvar</button>
            <span class="save-ok" id="saveOk">✓ Salvo</span>
          </div>
        </div>
      </main>
    </div>

    <script>
      /* ── AUTH ─────────────────────────────────── */
      const TOKEN = localStorage.getItem('cf_token');
      const USER = JSON.parse(localStorage.getItem('cf_user') || 'null');

      if (!TOKEN || !USER || (USER.role !== 'admin' && USER.role !== 'superadmin')) {
        window.location.href = '/login';
      }

      document.getElementById('adminName').textContent = USER?.name || 'Admin';
      document.getElementById('adminEmail').textContent = USER?.email || '';

      function authHeaders() {
        return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN };
      }

      async function api(path, opts = {}) {
        const res = await fetch('/api/admin' + path, {
          headers: authHeaders(),
          ...opts,
        });
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('cf_token');
          localStorage.removeItem('cf_user');
          window.location.href = '/login';
          return null;
        }
        return res.json();
      }

      function logout() {
        fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() });
        localStorage.removeItem('cf_token');
        localStorage.removeItem('cf_user');
        window.location.href = '/login';
      }

      /* ── SECTIONS ────────────────────────────── */
      function showSection(name) {
        document.querySelectorAll('.section').forEach((s) => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach((n) => n.classList.remove('active'));
        const sec = document.getElementById('sec-' + name);
        if (sec) sec.classList.add('active');
        const nav = document.querySelector('[data-section="' + name + '"]');
        if (nav) nav.classList.add('active');

        if (name === 'dashboard') loadDashboard();
        if (name === 'users') loadUsers();
        if (name === 'activity') loadActivity();
        if (name === 'settings') loadSettings();
      }

      /* ── DASHBOARD ───────────────────────────── */
      async function loadDashboard() {
        const data = await api('/stats');
        if (!data) return;
        document.getElementById('st-users').textContent = data.total_users ?? '—';
        document.getElementById('st-active').textContent = data.active_users ?? '—';
        document.getElementById('st-certs').textContent = data.total_certificates ?? '—';
        document.getElementById('st-logins').textContent = data.today_logins ?? '—';

        const container = document.getElementById('dash-activity-items');
        container.innerHTML = '';
        (data.recent_activity || []).slice(0, 15).forEach((a) => {
          container.innerHTML += `
      <div class="activity-item">
        <div><strong>${esc(a.name || '—')}</strong> ${esc(a.action)}</div>
        <div class="meta">${formatDate(a.created_at)}</div>
      </div>`;
        });
        if (!data.recent_activity?.length) {
          container.innerHTML =
            '<div class="activity-item" style="color:var(--text-3)">Nenhuma atividade registrada</div>';
        }
      }

      /* ── USERS ────────────────────────────────── */
      let usersPage = 1;

      async function loadUsers(page = 1, search = '') {
        usersPage = page;
        const q = search ? '&search=' + encodeURIComponent(search) : '';
        const data = await api('/users?page=' + page + q);
        if (!data) return;

        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';
        (data.users || []).forEach((u) => {
          const roleBadge =
            u.role === 'admin' || u.role === 'superadmin'
              ? '<span class="badge badge-admin">' + esc(u.role) + '</span>'
              : '<span class="badge badge-user">' + esc(u.role) + '</span>';
          const statusBadge = u.is_active
            ? '<span class="badge badge-active">ativo</span>'
            : '<span class="badge badge-inactive">inativo</span>';

          tbody.innerHTML += `<tr>
      <td>${esc(u.name)}</td>
      <td>${esc(u.email)}</td>
      <td>${roleBadge}</td>
      <td>${esc(u.plan_name || '—')}</td>
      <td>${statusBadge}</td>
      <td>${formatDate(u.created_at)}</td>
      <td class="actions-cell">
        <button class="action-btn" onclick="toggleUser(${u.id}, ${u.is_active ? 0 : 1})">${u.is_active ? 'Desativar' : 'Ativar'}</button>
        <button class="action-btn" onclick="changeRole(${u.id}, '${esc(u.role)}')">Papel</button>
        <button class="action-btn danger" onclick="deleteUser(${u.id}, '${esc(u.name)}')">Excluir</button>
      </td>
    </tr>`;
        });

        // Pagination
        const pag = document.getElementById('usersPagination');
        pag.innerHTML = '';
        for (let i = 1; i <= (data.pages || 1); i++) {
          const active = i === page ? 'background:var(--accent);color:#fff;' : '';
          pag.innerHTML += `<button class="action-btn" style="${active}" onclick="loadUsers(${i}, document.getElementById('userSearch').value)">${i}</button>`;
        }
      }

      function searchUsers() {
        const q = document.getElementById('userSearch').value;
        loadUsers(1, q);
      }

      async function toggleUser(id, active) {
        await api('/users/' + id + '/toggle', {
          method: 'POST',
          body: JSON.stringify({ is_active: active }),
        });
        loadUsers(usersPage, document.getElementById('userSearch').value);
      }

      async function changeRole(id, currentRole) {
        const roles = ['user', 'editor', 'admin', 'superadmin'];
        const role = prompt(
          'Novo papel para o usuário:\n\nOpções: ' + roles.join(', ') + '\n\nAtual: ' + currentRole,
        );
        if (!role || !roles.includes(role)) return;
        await api('/users/' + id + '/role', {
          method: 'POST',
          body: JSON.stringify({ role }),
        });
        loadUsers(usersPage, document.getElementById('userSearch').value);
      }

      async function deleteUser(id, name) {
        if (!confirm('Excluir o usuário "' + name + '"? Esta ação não pode ser desfeita.')) return;
        await api('/users/' + id, { method: 'DELETE' });
        loadUsers(usersPage, document.getElementById('userSearch').value);
      }

      /* ── ACTIVITY ────────────────────────────── */
      async function loadActivity() {
        const data = await api('/stats');
        if (!data) return;
        const container = document.getElementById('activityItems');
        container.innerHTML = '';
        (data.recent_activity || []).forEach((a) => {
          container.innerHTML += `
      <div class="activity-item">
        <div><strong>${esc(a.name || '—')}</strong> ${esc(a.action)} ${a.ip_address ? '(' + esc(a.ip_address) + ')' : ''}</div>
        <div class="meta">${formatDate(a.created_at)}</div>
      </div>`;
        });
        if (!data.recent_activity?.length) {
          container.innerHTML =
            '<div class="activity-item" style="color:var(--text-3)">Nenhuma atividade registrada</div>';
        }
      }

      /* ── SETTINGS ────────────────────────────── */
      async function loadSettings() {
        const data = await api('/settings');
        if (!data || !data.settings) return;

        const map = {};
        data.settings.forEach((s) => {
          map[s.setting_key] = s.setting_value;
        });

        document.getElementById('set-site-name').value = map.site_name || '';
        document.getElementById('set-registration').value = map.allow_registration || '1';
        document.getElementById('set-trial-days').value = map.trial_days || '7';
        document.getElementById('set-maintenance').value = map.maintenance_mode || '0';
      }

      async function saveSettings() {
        const fields = document.querySelectorAll('[data-key]');
        const settings = {};
        fields.forEach((f) => {
          settings[f.dataset.key] = f.value;
        });

        await api('/settings', {
          method: 'POST',
          body: JSON.stringify(settings),
        });

        const ok = document.getElementById('saveOk');
        ok.classList.add('show');
        setTimeout(() => ok.classList.remove('show'), 2000);
      }

      /* ── HELPERS ─────────────────────────────── */
      function esc(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
      }

      function formatDate(d) {
        if (!d) return '—';
        const dt = new Date(d);
        return (
          dt.toLocaleDateString('pt-BR') +
          ' ' +
          dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
        );
      }

      /* ── INIT ────────────────────────────────── */
      loadDashboard();
    </script>
  </body>
</html>
